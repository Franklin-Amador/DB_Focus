<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FocusDB Studio</title>
<!-- CodeMirror vendoreado (offline) -->
<link rel="stylesheet" href="vendor/codemirror/codemirror.min.css">
<link rel="stylesheet" href="vendor/codemirror/theme/dracula.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/hint/show-hint.min.css">
<link rel="stylesheet" href="vendor/codemirror/addon/dialog/dialog.min.css">
<!-- Estilos de la app (design system Botánico nocturno) -->
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<div id="motes" aria-hidden="true"></div>
<div id="toasts" aria-live="polite"></div>

<header>
  <button id="sidebar-toggle" onclick="toggleSidebar()" title="Mostrar/ocultar panel">☰</button>
  <span class="logo"><span class="leaf">🌿</span> focus<span class="logo-db">db</span></span>
  <span class="logo-port">studio · :9011</span>
  <span class="conn-badge" id="conn-badge">● conectado</span>
  <div style="margin-left:auto;display:flex;gap:6px;align-items:center">
    <button class="nav-btn active" id="nav-query"   onclick="showView('query')"><span class="ti"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M3 4l3.5 4L3 12"/><line x1="8.5" y1="12" x2="13" y2="12"/></svg></span> <span class="btn-label">Consulta</span></button>
    <button class="nav-btn"        id="nav-diagram" onclick="showView('diagram')"><span class="ti"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2.5" width="5" height="4" rx="1"/><rect x="9" y="9.5" width="5" height="4" rx="1"/><path d="M4.5 6.5v3.5a1 1 0 0 0 1 1H9"/></svg></span> <span class="btn-label">Diagrama</span></button>
  </div>
</header>

<div id="sidebar-backdrop" onclick="closeSidebar()"></div>

<div class="workspace">

  <!-- Sidebar -->
  <aside id="sidebar">
    <div class="sb-search">
      <input id="tree-filter" class="has-search-ico" type="text" placeholder="Filtrar objetos…" oninput="filterTree(this.value)">
    </div>
    <div class="sb-tree" id="sb-tree">
      <div class="empty-state" style="height:120px"><p>Cargando esquema…</p></div>
    </div>
  </aside>

  <!-- Editor + Results -->
  <div id="main">
    <div id="toolbar">
      <button class="btn btn-run" id="btn-run" onclick="runQuery()" title="F5 — ejecuta selección o statement actual"><span class="ti"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M4 2.5v11l9-5.5z"/></svg></span> <span class="btn-label">Ejecutar</span></button>
      <button class="btn btn-runall" id="btn-runall" onclick="runAll()" title="Ctrl+Shift+Enter — ejecuta todo el script"><span class="ti"><svg width="13" height="13" viewBox="0 0 16 16" fill="currentColor"><path d="M2 2.5v11l6-5.5z"/><path d="M8 2.5v11l6-5.5z"/></svg></span> <span class="btn-label">Ejecutar todo</span></button>
      <button class="btn btn-clear" onclick="clearEditor()"><span class="ti"><svg width="13" height="13" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M4 4l8 8M12 4l-8 8"/></svg></span> <span class="btn-label">Limpiar</span></button>
      <button class="btn btn-fmt" onclick="activateTab('history')"><span class="ti"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="8" cy="8" r="6"/><path d="M8 4.5V8l2.5 1.5"/></svg></span> <span class="btn-label">Historial</span></button>
      <button class="btn btn-cancel" id="btn-cancel" style="display:none" onclick="cancelRun()" title="Cancelar la consulta en curso"><span class="ti"><svg width="12" height="12" viewBox="0 0 16 16" fill="currentColor"><rect x="3.5" y="3.5" width="9" height="9" rx="1.5"/></svg></span> <span class="btn-label">Cancelar</span></button>
      <span id="run-mode" style="font-size:11px;color:var(--dim);margin-left:4px"></span>
      <span id="run-status"></span>
    </div>

    <div id="tab-strip"></div>

    <div id="editor-pane">
      <textarea id="sql-input">SELECT * FROM </textarea>
    </div>

    <div id="validate-bar" class="idle">En reposo</div>

    <div id="resizer"></div>

    <div id="results-pane">
      <div class="tabs-bar">
        <div class="tab-btn active" id="tab-results" onclick="activateTab('results')">Resultados</div>
        <div class="tab-btn" id="tab-history" onclick="activateTab('history')">Historial</div>
      </div>

      <div class="tab-panel active" id="tc-results">
        <div id="results-toolbar" style="display:none">
          <input id="results-filter" class="has-search-ico" type="text" placeholder="Filtrar resultados…" oninput="filterResults(this.value)">
          <div class="rt-spacer"></div>
          <button class="btn btn-clear rt-btn" onclick="exportResultsCSV()" title="Exportar el conjunto filtrado como CSV">↓ CSV</button>
          <button class="btn btn-clear rt-btn" onclick="exportResultsJSON()" title="Exportar el conjunto filtrado como JSON">↓ JSON</button>
        </div>
        <div id="results-wrap">
          <div class="empty-state">
            <svg class="sprig" viewBox="0 0 64 64" fill="none" stroke="#7bb661" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M32 61 C32 46 32 32 32 15"/>
              <path d="M32 45 C22 43 16 37 15 28 C24 28 30 33 32 41Z" fill="rgba(123,182,97,.20)"/>
              <path d="M32 37 C42 35 48 29 49 20 C40 20 34 25 32 33Z" fill="rgba(224,164,88,.18)" stroke="#e0a458"/>
              <path d="M32 25 C24 23 19 18 18 10 C26 10 31 15 32 22Z" fill="rgba(123,182,97,.20)"/>
            </svg>
            <h3>El jardín está en calma</h3>
            <p>Ejecutá una consulta para ver brotar los resultados</p>
            <p><kbd>Ctrl</kbd> + <kbd>Enter</kbd> para ejecutar</p>
          </div>
        </div>
        <div class="results-footer" id="results-footer"></div>
      </div>

      <div class="tab-panel" id="tc-history">
        <div id="history-wrap">
          <div class="empty-state"><p>Aún no hay consultas</p></div>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── Explorer overlay ─────────────────────────────────────────────────── -->
<div id="explorer-view">
  <div id="explorer-toolbar">
    <button class="btn btn-clear" onclick="showView('query')" title="Volver al editor">←</button>
    <span class="explorer-name"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><rect x="2" y="3" width="12" height="10" rx="1.5"/><line x1="2" y1="6.5" x2="14" y2="6.5"/><line x1="7" y1="6.5" x2="7" y2="13"/></svg> <span id="explorer-title"></span></span>
    <div class="dtb-sep"></div>
    <button class="btn btn-clear dtb-zoom-btn" onclick="explorerPage(-1)" title="Página anterior">‹</button>
    <span class="diag-zoom-pct" id="explorer-page">1 / 1</span>
    <button class="btn btn-clear dtb-zoom-btn" onclick="explorerPage(1)" title="Página siguiente">›</button>
    <div class="dtb-sep"></div>
    <button class="btn btn-clear" onclick="explorerRefresh()" title="Recargar">↺</button>
    <button class="btn btn-run" id="explorer-insert-btn" onclick="explorerInsertOpen()">+ <span class="btn-label">Insertar fila</span></button>
    <span id="explorer-status" style="margin-left:auto;font-size:11px;color:var(--dim)"></span>
  </div>
  <div id="explorer-grid"></div>
  <div id="explorer-hint">Doble clic en una celda para editar · Enter guarda · Esc cancela</div>
</div>

<!-- ── Diagram overlay ──────────────────────────────────────────────────── -->
<div id="diagram-view">
  <div id="diagram-toolbar">
    <button class="btn btn-clear" onclick="reloadDiagram()" title="Recargar esquema (conserva posiciones)">↺</button>
    <button class="btn btn-clear" onclick="fitDiagram()" title="Ajustar todo  [F]">⊡ Ajustar</button>
    <button class="btn btn-clear" onclick="resetDiagramLayout()" title="Reorganizar  [R]">⟳ Organizar</button>
    <div class="dtb-sep"></div>
    <input id="diag-search" class="diag-search-input has-search-ico" type="text"
           placeholder="Buscar tabla…" oninput="diagSearch(this.value)">
    <div class="dtb-sep"></div>
    <button class="btn btn-clear dtb-zoom-btn" onclick="diagZoomBy(-0.15)" title="Zoom out  [−]">−</button>
    <span class="diag-zoom-pct" id="diag-zoom-pct">100%</span>
    <button class="btn btn-clear dtb-zoom-btn" onclick="diagZoomBy(+0.15)" title="Zoom in  [+]">+</button>
    <div class="dtb-sep"></div>
    <button class="btn btn-clear" id="btn-compact" onclick="toggleCompact()">≡ Compacto</button>
    <div class="dtb-sep"></div>
    <button class="btn btn-clear" onclick="exportSVG()" title="Exportar como vector SVG">↓ SVG</button>
    <button class="btn btn-clear" onclick="exportPNG()" title="Exportar como imagen PNG (2×)">↓ PNG</button>
    <span id="diagram-status"></span>
  </div>
  <svg id="diagram-svg" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <marker id="fk-arrow" markerWidth="10" markerHeight="8"
              refX="9" refY="4" orient="auto">
        <polygon points="0 0, 10 4, 0 8" fill="#6fb3a8"/>
      </marker>
      <marker id="fk-circle" markerWidth="8" markerHeight="8"
              refX="4" refY="4" orient="auto">
        <circle cx="4" cy="4" r="3" fill="#0b1410" stroke="#6fb3a8" stroke-width="1.8"/>
      </marker>
    </defs>
    <g id="diagram-root">
      <g id="diagram-lines"></g>
      <g id="diagram-tables"></g>
    </g>
  </svg>
  <svg id="diagram-minimap" width="168" height="120" aria-hidden="true"></svg>
</div>

<!-- CodeMirror 5 (vendoreado, script clásico: expone window.CodeMirror antes de los módulos) -->
<script src="vendor/codemirror/codemirror.min.js"></script>
<script src="vendor/codemirror/mode/sql/sql.min.js"></script>
<script src="vendor/codemirror/addon/hint/show-hint.min.js"></script>
<script src="vendor/codemirror/addon/hint/sql-hint.min.js"></script>
<script src="vendor/codemirror/addon/edit/matchbrackets.min.js"></script>
<script src="vendor/codemirror/addon/edit/closebrackets.min.js"></script>
<script src="vendor/codemirror/addon/selection/active-line.min.js"></script>
<script src="vendor/codemirror/addon/search/searchcursor.min.js"></script>
<script src="vendor/codemirror/addon/search/search.min.js"></script>
<script src="vendor/codemirror/addon/dialog/dialog.min.js"></script>

<!-- App (módulos ES) -->
<script type="module" src="js/app.js"></script>

</body>
</html>
